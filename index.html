  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA redirect — restore path from 404.html
      (function() {
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          var repo = '/pdf-tools';
          window.history.replaceState(null, '', repo + redirect);
        }
      })();

      // Web Vitals tracking (privacy-friendly, no PII)
      // Sends to console in dev, can be extended to send to analytics endpoint
      (function() {
        var vitals = {};
        var sent = false;

        function sendVitals() {
          if (sent || !navigator.sendBeacon) return;
          sent = true;
          // In production, replace with your analytics endpoint
          // navigator.sendBeacon('/api/vitals', JSON.stringify(vitals));
          console.log('[Web Vitals]', vitals);
        }

        // LCP
        try {
          new PerformanceObserver(function(list) {
            var entries = list.getEntries();
            var last = entries[entries.length - 1];
            vitals.lcp = Math.round(last.startTime);
            sendVitals();
          }).observe({ type: 'largest-contentful-paint', buffered: true });
        } catch (e) {}

        // FID
        try {
          new PerformanceObserver(function(list) {
            var entries = list.getEntries();
            var first = entries[0];
            vitals.fid = Math.round(first.processingStart - first.startTime);
            sendVitals();
          }).observe({ type: 'first-input', buffered: true });
        } catch (e) {}

        // CLS
        try {
          var clsValue = 0;
          new PerformanceObserver(function(list) {
            var entries = list.getEntries();
            for (var i = 0; i < entries.length; i++) {
              if (!entries[i].hadRecentInput) {
                clsValue += entries[i].value;
              }
            }
            vitals.cls = Math.round(clsValue * 1000) / 1000;
          }).observe({ type: 'layout-shift', buffered: true });
        } catch (e) {}

        // TTFB
        try {
          var nav = performance.getEntriesByType('navigation')[0];
          if (nav) {
            vitals.ttfb = Math.round(nav.responseStart - nav.requestStart);
          }
        } catch (e) {}

        // Send on page hide
        window.addEventListener('pagehide', sendVitals);
      })();
    </script>
